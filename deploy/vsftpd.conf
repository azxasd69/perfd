# Канал 5б: только FTPS (ТЗ Р-16, ФТ-46). Открытый FTP невозможен на уровне конфигурации.
# Адрес пассивного режима — лабораторный; на VDS заменяется на 91.188.222.193.

listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=002
chroot_local_user=YES
allow_writeable_chroot=YES
# у perfdrop оболочка nologin: без этого vsftpd отвергает вход (check_shell по умолчанию YES)
check_shell=NO

# только TLS
# ВАЖНО: пути к сертификату — ДО ssl_enable. vsftpd проверяет ssl_enable в момент разбора
# строки, и при пустых путях выходит с rc=2 (проверено на 3.0.5: «ssl без cert» = rc 2).
rsa_cert_file=/etc/perf/tls/lab.crt
rsa_private_key_file=/etc/perf/tls/lab.key
ssl_enable=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
# ssl_tlsv1_2 / ssl_tlsv1_3 в этой сборке не существуют: любая из этих строк роняет
# vsftpd с rc=2 (проверено поштучно). Минимум TLS 1.2 обеспечивает OpenSSL 3 (security level 1),
# устаревшие протоколы отключены строками выше.
require_ssl_reuse=NO

# пассивный режим: без этих строк канал поднимется, а данные не пойдут
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30010
pasv_address=172.28.0.10

hide_ids=YES
ls_recurse_enable=NO
xferlog_enable=YES
xferlog_file=/var/log/perf/vsftpd.log
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
