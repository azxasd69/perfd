# Канал 6: IMAP только над TLS, логин только perfing/perfack, SASL-сокет для postfix.
# ТЗ Приложение В (дovecot 99-perf.conf), адрес лабораторный.

protocols = imap
listen = 172.28.0.10
ssl = required
ssl_cert = </etc/perf/tls/lab.crt
ssl_key = </etc/perf/tls/lab.key
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = yes
auth_mechanisms = plain login
mail_location = maildir:/var/mailvhost/%u

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/perf/mail/users
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/perf/mail/users
  default_fields = home=/var/mailvhost/%u
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# SASL-сокет для postfix
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

log_path = /var/log/perf/dovecot.log
