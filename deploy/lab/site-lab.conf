# Сайт контура: тот же набор маршрутов, что на VDS, плюс 443 с тестовым сертификатом.
# Подключается как /etc/nginx/sites-available/testib.ru (symlink в sites-enabled).
# Основа — снимок Э-0 (tools\vps\backup\20261108\site-conf.txt), добавлены 443 и портал.

limit_req_zone $binary_remote_addr zone=perf_ingest:10m rate=60r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name testib.ru www.testib.ru _;

    root /var/www/sites/testib.ru/current;
    index index.html;

    access_log /var/www/sites/testib.ru/logs/access.log;
    error_log  /var/www/sites/testib.ru/logs/error.log warn;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/snippets/perf-portal.conf;

    # Канал 4 (HTTP 80) данные не принимает — решение Р-21 / О-05.
    # Слушатель остаётся, чтобы 1С получила внятный отказ, а не таймаут.
    location = /perf/api/v1/ingest { default_type application/json; return 404 '{"error":"channel_closed","message":"приём только по 443"}\n'; }
    location = /perf/api/v1/import { default_type application/json; return 404 '{"error":"channel_closed","message":"приём только по 443"}\n'; }
    # 1С постит в /api/v1/ingest (ПерфОбмен, путь без префикса портала) — на 80 отказ.
    location ^~ /api/v1/ { default_type application/json; return 404 '{"error":"channel_closed","message":"приём только по 443"}\n'; }
    # WebDAV (канал 5а) — тоже только по TLS.
    location ^~ /dav/ { return 404; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(env|git|sql|bak|ini|log)$ { deny all; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testib.ru www.testib.ru _;

    ssl_certificate     /etc/ssl/perf/lab.crt;
    ssl_certificate_key /etc/ssl/perf/lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    root /var/www/sites/testib.ru/current;
    index index.html;

    access_log /var/www/sites/testib.ru/logs/access.log;
    error_log  /var/www/sites/testib.ru/logs/error.log warn;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/snippets/perf-portal.conf;

    # 1С (ПерфОбмен) обращается к /api/v1/... без префикса портала.
    # Срезаем /api/v1/ и проксируем в /perf/api/v1/ — приложение остаётся под своим префиксом.
    location ^~ /api/v1/ {
        client_max_body_size 1m;
        limit_req zone=perf_ingest burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080/perf/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # WebDAV (канал 5а): PUT /dav/<id>.json попадает в in/webdav/, откуда его берёт обходчик.
    location ^~ /dav/ {
        auth_basic "PerfTest DAV";
        auth_basic_user_file /etc/perf/dav.htpasswd;
        dav_methods PUT DELETE;
        dav_access user:rw group:rw all:r;
        create_full_put_path on;
        client_body_temp_path /var/lib/perf/tmp;
        client_max_body_size 5m;
        alias /var/lib/perf/in/webdav/;
        autoindex off;
        limit_except PUT DELETE { deny all; }
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(env|git|sql|bak|ini|log)$ { deny all; }
}
