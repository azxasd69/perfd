#cloud-config
# ШАБЛОН autoinstall для тестового контура Hyper-V (план § 4Б, П-1).
# Секретов здесь нет: строка пароля и ключ подставляются при сборке seed
# скриптом scratch\make-seed.ps1 из tools\vps\.secret\ и D:\dev\keys\.
autoinstall:
  version: 1
  refresh-installer:
    update: false
  locale: en_US.UTF-8
  keyboard:
    layout: us
  timezone: Europe/Moscow

  identity:
    hostname: perf-test
    username: perfadmin
    # __IDENTITY_PASSWORD_LINE__

  ssh:
    install-server: true
    allow-pw: false
    authorized-keys:
      - "__LAB_PUBKEY__"

  storage:
    layout:
      name: direct

  network:
    version: 2
    ethernets:
      lan:
        match:
          name: "e*"
        dhcp4: false
        addresses:
          - 172.28.0.10/24
        routes:
          - to: default
            via: 172.28.0.1
        nameservers:
          addresses: [1.1.1.1, 8.8.8.8]

  packages:
    - nginx
    - certbot
    - fail2ban
    - sqlite3
    - jq
    - rsync
    - git

  write_files:
    - path: /etc/sudoers.d/90-lab
      permissions: '0440'
      owner: root:root
      content: |
        perfadmin ALL=(ALL) NOPASSWD:ALL
