# Портал замеров: маршруты за nginx (план web-контура § 4Б, П-3/П-4).
# Префикс НЕ срезается: приложение живёт с PERF_BASE_PATH=/perf и само строит ссылки.
# Подключается из site-блока: include /etc/nginx/snippets/perf-portal.conf;

# Проверка живости самого nginx (не зависит от perfd) — для мониторинга хоста.
location = /nginx-healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Проверка живости сервиса: 200 «ok» или 503 при недоступной БД.
# Внутри приложения все маршруты живут под префиксом публикации (PERF_BASE_PATH),
# поэтому проксируем на /perf/healthz, а наружу отдаём короткий /healthz.
location = /healthz {
    access_log off;
    proxy_pass http://127.0.0.1:8080/perf/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# Приём конвертов и API: лимит тела и отдельная зона частоты.
location /perf/api/ {
    client_max_body_size 1m;
    limit_req zone=perf_ingest burst=20 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Страницы портала.
location /perf/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Короткий редирект с /perf на /perf/ — иначе браузер уйдёт в статику сайта.
location = /perf {
    return 301 /perf/;
}
