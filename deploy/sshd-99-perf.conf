# Канал 7: SFTP-only учётка perfdrop (ТЗ ФТ-49).
# Глобальные PasswordAuthentication и PermitRootLogin НЕ меняются (О-06, Р-22).

MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 24
KbdInteractiveAuthentication no

Match User perfdrop
    ChrootDirectory /var/lib/perf/sftp
    ForceCommand internal-sftp -u 002 -l INFO
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    PasswordAuthentication no
    AuthenticationMethods publickey
    PermitTTY no
